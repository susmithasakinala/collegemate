<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rent Items - CollegeMate</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <style>
    body { background-color:#f0f8ff; font-family:'Roboto', sans-serif; }
    .navbar { background-color:#0099ff; padding:12px 24px; }
    .navbar-brand { color:white; font-size:22px; font-weight:bold; }
    .navbar-brand span { color:#cceeff; }
    .back-btn { color:white; background:transparent; border:2px solid white;
      border-radius:8px; padding:6px 16px; font-size:14px; cursor:pointer; }
    .back-btn:hover { background:white; color:#0099ff; }
    .cart-btn { position:relative; color:white; background:transparent;
      border:2px solid white; border-radius:8px; padding:6px 16px;
      font-size:14px; cursor:pointer; margin-left:8px; }
    .cart-btn:hover { background:white; color:#0099ff; }
    .cart-count { position:absolute; top:-8px; right:-8px; background:red;
      color:white; border-radius:50%; width:18px; height:18px;
      font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
    .search-bar { background:white; padding:16px 24px; border-bottom:1px solid #dde; }
    .search-input { border-radius:8px; border:1px solid #ccc; padding:8px 14px;
      font-size:14px; width:260px; }
    .search-btn { background:#0099ff; color:white; border:none; border-radius:8px;
      padding:8px 20px; cursor:pointer; margin-left:8px; }
    .search-btn:hover { background:#007acc; }
    .item-card { background:white; border-radius:14px; overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,0.09); transition:0.2s; height:100%; }
    .item-card:hover { transform:translateY(-3px); box-shadow:0 6px 20px rgba(0,153,255,0.15); }
    .item-img { width:100%; height:200px; object-fit:cover; }
    .item-body { padding:14px; }
    .item-name { font-weight:bold; color:#222; font-size:16px; margin-bottom:4px; }
    .item-price { color:#0099ff; font-weight:bold; font-size:15px; }
    .item-owner { color:gray; font-size:12px; margin-top:4px; }
    .rent-btn { background:#0099ff; color:white; border:none; border-radius:8px;
      padding:8px; font-size:14px; width:100%; margin-top:10px; cursor:pointer; }
    .rent-btn:hover { background:#007acc; }
    .no-items { text-align:center; padding:60px; color:gray; }
    .new-badge { background:#00cc66; color:white; font-size:11px;
      border-radius:10px; padding:2px 8px; margin-left:6px; }
  </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
  <span class="navbar-brand">College<span>Mate</span></span>
  <div>
    <button class="back-btn" onclick="window.location.href='HomePage.html'">🏠 Home</button>
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      🛒 Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<!-- SEARCH -->
<div class="search-bar d-flex align-items-center">
  <span style="font-weight:bold; margin-right:12px; color:#333;">🔍 Browse Items</span>
  <input type="text" class="search-input" id="searchInput" placeholder="Search items..."/>
  <button class="search-btn" onclick="searchItems()">Search</button>
  <button class="search-btn" style="background:#888; margin-left:6px;" onclick="clearSearch()">Clear</button>
</div>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 style="font-weight:bold; color:#222; margin:0;">Available Items</h4>
    <span style="color:gray; font-size:13px;" id="itemCountLabel"></span>
  </div>
  <div class="row" id="itemsGrid"></div>
  <div class="no-items" id="noItems" style="display:none;">
    <div style="font-size:48px;">📭</div>
    <p>No items found. Try a different search.</p>
  </div>
</div>

<!-- ADD TO CART TOAST -->
<div id="toast" style="display:none; position:fixed; bottom:30px; right:30px;
  background:#0099ff; color:white; padding:14px 24px; border-radius:12px;
  font-weight:bold; box-shadow:0 4px 16px rgba(0,0,0,0.2); z-index:9999;">
  ✅ Added to Cart!
</div>

<script>
  // Default items
  var defaultItems = [
    { id:1, name:'Scientific Calculator', price:'50rs/hour', owner:'Ravi Kumar', img:'https://i.pinimg.com/736x/50/f4/49/50f44914865276b3832a0b76cad7d6f2.jpg', deposit:500, isNew:false },
    { id:2, name:'BEEE Lab Coat', price:'20rs/hour', owner:'Priya Sharma', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGOv5XTvofFlBwn27VKqBk2vgp-1ibJzCetQ&s', deposit:300, isNew:false },
    { id:3, name:'Laptop', price:'100rs/hour', owner:'Arjun Reddy', img:'https://plus.unsplash.com/premium_photo-1681160405580-a68e9c4707f9?q=80&w=765&auto=format&fit=crop', deposit:2000, isNew:false },
    { id:4, name:'Cricket Bat & Ball', price:'30rs/hour', owner:'Sneha Patel', img:'https://plus.unsplash.com/premium_photo-1679917506577-6c986f6faab6?q=80&w=735&auto=format&fit=crop', deposit:400, isNew:false }
  ];

  function getAllItems() {
    var uploaded = JSON.parse(sessionStorage.getItem('uploadedItems') || '[]');
    return defaultItems.concat(uploaded);
  }

  function renderItems(items) {
    var grid = document.getElementById('itemsGrid');
    var noItems = document.getElementById('noItems');
    document.getElementById('itemCountLabel').textContent = items.length + ' item(s) available';
    if (items.length === 0) {
      grid.innerHTML = '';
      noItems.style.display = 'block';
      return;
    }
    noItems.style.display = 'none';
    grid.innerHTML = items.map(function(item) {
      return '<div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">' +
        '<div class="item-card">' +
        '<img src="' + item.img + '" class="item-img" alt="' + item.name + '" onerror="this.src=\'https://via.placeholder.com/300x200?text=No+Image\'"/>' +
        '<div class="item-body">' +
        '<div class="item-name">' + item.name + (item.isNew ? '<span class="new-badge">NEW</span>' : '') + '</div>' +
        '<div class="item-price">💰 ' + item.price + '</div>' +
        '<div class="item-owner">👤 ' + item.owner + '</div>' +
        '<button class="rent-btn" onclick="rentItem(' + item.id + ')">🛒 Add to Cart & Rent</button>' +
        '</div></div></div>';
    }).join('');
  }

  function searchItems() {
    var query = document.getElementById('searchInput').value.trim().toLowerCase();
    var all = getAllItems();
    if (!query) { renderItems(all); return; }
    var filtered = all.filter(function(i) { return i.name.toLowerCase().includes(query); });
    renderItems(filtered);
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    renderItems(getAllItems());
  }

  function rentItem(id) {
    var all = getAllItems();
    var item = all.find(function(i) { return i.id === id; });
    if (!item) return;
    // Save selected item for rentnow page
    sessionStorage.setItem('selectedItem', JSON.stringify(item));
    window.location.href = 'rentnow.html';
  }

  function updateCartCount() {
    var cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
    document.getElementById('cartCount').textContent = cart.length;
  }

  // Init
  renderItems(getAllItems());
  updateCartCount();
</script>
</body>
</html>
